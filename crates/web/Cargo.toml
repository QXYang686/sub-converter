[package]
name = "sub-converter-web"
version = "0.1.0"
edition = "2021"

[dependencies]
sub-converter-contract = { path = "../contract" }
console_error_panic_hook = "0.1"
futures = "0.3"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
send_wrapper = "0.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "Navigator", "Clipboard"] }
