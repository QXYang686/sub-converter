[package]
name = "sub-converter-auth"
version = "0.1.0"
edition = "2021"

[lib]
name = "auth"

[dependencies]
sub-converter-user = { path = "../user" }
async-trait = "0.1"
base64 = "0.22"
ciborium = "0.2"
ed25519-dalek = "2"
hmac = "0.12"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4", "js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
worker = { version = "0.8", features = ["d1"] }

[dev-dependencies]
futures = "0.3"
