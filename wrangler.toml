# 顶层默认节 = dev 环境（本地与线上 dev 共用）
name = "sub-converter-dev"
main = "crates/api/build/index.js"
compatibility_date = "2026-10-02"

[build]
command = "cd crates/api && cargo install -q \"worker-build@^0.8\" && worker-build --release && cd ../web && trunk build --release"

[assets]
directory = "./crates/web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/s/*"]

[vars]
# 线上 dev 的取值；本地用 .dev.vars 覆盖为 localhost
WEBAUTHN_RP_ID = "sub-converter-dev.yqxpro.workers.dev"
WEBAUTHN_ORIGINS = "https://sub-converter-dev.yqxpro.workers.dev"
LOG_LEVEL = "info"

[observability]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

[placement]
mode = "smart"

[[d1_databases]]
binding = "DB"
database_name = "sub-converter-db-dev"
database_id = "4b68349b-cb37-461d-9fa3-90bf4e87f2c0"

[env.production]
name = "sub-converter"

[env.production.vars]
WEBAUTHN_RP_ID = "yqxpro.com"
WEBAUTHN_ORIGINS = "https://sub.yqxpro.com"
LOG_LEVEL = "info"

[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.observability.traces]
enabled = true
head_sampling_rate = 1

[env.production.placement]
mode = "smart"

[[env.production.d1_databases]]
binding = "DB"
database_name = "sub-converter-db-prod"
database_id = "8a4ff7ef-fcff-4594-830c-da5604ec8c73"

[[env.production.routes]]
pattern = "sub.yqxpro.com"
custom_domain = true
