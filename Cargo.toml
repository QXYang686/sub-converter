[package]
name = "sub-converter-api"
version = "0.1.0"
edition = "2021"
authors = ["QXYang686 <me@yqxpro.com>"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json"] }
tower-service = "0.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "js"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8", features = ["http", "axum", "d1"] }
worker-macros = { version = "0.8", features = ["http"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
futures = "0.3"
